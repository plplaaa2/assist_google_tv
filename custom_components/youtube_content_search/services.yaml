search_play:
  name: YouTube 검색 재생
  description: 지정한 검색어로 YouTube 영상을 찾아 선택한 미디어 플레이어(Cast 지원 기기)에서 재생합니다. 
             내부적으로 YouTube videoId 또는 playlistId를 검색하여 Cast JSON 형식으로 전달합니다.
  fields:
    query:
      name: 검색어
      description: YouTube에서 검색할 키워드 (영상 또는 재생목록)
      required: true
      example: 아이유 콘서트
      selector:
        text:
    entity_id:
      name: 미디어 플레이어
      description: 영상을 재생할 Cast 지원 TV/디스플레이 엔티티를 선택하세요 (스피커는 지원하지 않음)
      required: true
      selector:
        entity:
          domain: media_player

playlist_save:
  name: 플레이리스트에 동영상 추가
  description: 검색 결과에서 선택한 동영상을 특정 플레이리스트 ID에 저장합니다.
  fields:
    video_ids:
      name: 영상 ID 목록
      description: 플레이리스트에 추가할 YouTube 영상 ID (逗号 구분)
      required: true
      example: dQw4w9WgXcQ,abc123
      selector:
        text:
    playlist_id:
      name: 플레이리스트 ID
      description: 저장할 플레이리스트의 고유한 ID
      required: true
      example: my-playlist-001
      selector:
        text:

playlist_delete:
  name: 플레이리스트 삭제
  description: 지정된 ID를 가진 플레이리스트를 삭제합니다.
  fields:
    id:
      name: 플레이리스트 ID
      description: 삭제할 플레이리스트의 고유한 ID
      required: true
      example: my-playlist-001
      selector:
        text:
